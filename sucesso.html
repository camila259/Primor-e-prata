<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro realizado</title>
  <style>
    body {
      background-color: #111; 
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }

    .container {
      background-color: #1c1c1c; 
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    h2 {
      color: #00bfff; 
      margin-bottom: 20px;
    }

    p {
      margin-bottom: 25px;
      font-size: 16px;
    }

    .btn {
      display: inline-block;
      background-color: #00bfff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #0099cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>✅ Cadastro realizado com sucesso!</h2>
    <p>Agora é só entrar no seu email e verificar nossas peças exclusivas e descontos imperdiveis para você!
    </p>
    <a href="index.html" class="btn">Ir para página inicial</a>
  </div>
</body>
</html>
